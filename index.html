<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Простой видеоплеер</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player-container">
      <video id="video-player" poster="poster.jpg">
        <!-- Сюда можно положить свои видео -->
        <source src="videos/sample.mp4" type="video/mp4" />
        Ваш браузер не поддерживает видео.
      </video>

      <div class="controls">
        <button id="play-pause">▶ Воспроизвести</button>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.8" />
        <span id="volume-label">80%</span>
        <button id="fullscreen">📺 Полноэкранный режим</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
